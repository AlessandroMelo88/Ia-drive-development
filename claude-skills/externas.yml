# Skills de terceiros VERSIONADAS em skills/externas/<nome>/. Este arquivo registra de onde cada uma
# veio, para atualizar depois. Fontes originais: ~/.agents/.skill-lock.json (CLI `npx skills`) e
# skills/externas/SKILLS-ORIGEM.tsv.
#
# Atualizar uma externa (detalhes no README, seção "Skills externas"):
#   1. reinstale pelo instalador dela (ex.: npx skills add usestrix/strix);
#   2. bin/importar-externas.sh <nome>   copia a versão nova para skills/externas/<nome>/;
#   3. revise o git diff, ajuste a versão aqui, commite;  4. bin/instalar-perfis.sh religa.
#
# Formato: nome | origem | versão | fonte local para importar (opcional; padrão: primeira cópia
# fora do repo encontrada nos destinos de perfis.yml, na ordem de lá).
# As `synced/` (Claude.ai) e as skills de plugins NÃO entram aqui.

