# Manifesto do projeto riodelux. Globais (skills/global/*) já chegam pelo perfil: não listar aqui.
# fleet-ui é específica do projeto.
projeto: riodelux
caminho: ~/develop/server/wordpress/riodelux
stack: laravel + next (backoffice) + tauri
deploy: sem workflow

skills:   # caminhos relativos a skills/; ligados em <projeto>/.claude/skills por bin/instalar.sh
  - deploy/deploy-github-actions-ssh
  - stack/web/validacao-visual

locais:   # skills que vivem no repo do próprio projeto (só inventário; o instalar.sh não mexe)
  - fleet-ui
